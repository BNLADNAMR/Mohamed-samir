    <script>
      (function () {
        function isAbortReason(reason) {
          if (!reason) return false;
          var name = typeof reason === 'object' && reason.name ? String(reason.name).toLowerCase() : '';
          var code = typeof reason === 'object' && reason.code ? reason.code : '';
          var msg = typeof reason === 'string'
            ? reason.toLowerCase()
            : (typeof reason === 'object' && reason.message ? String(reason.message).toLowerCase() : '');
          if (msg.indexOf('permission') !== -1 || msg.indexOf('quota') !== -1) return false;
          return (
            name === 'aborterror' ||
            code === 20 ||
            msg.indexOf('the user aborted a request') !== -1 ||
            msg.indexOf('signal is aborted') !== -1 ||
            msg.indexOf('the operation was aborted') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function (e) {
          if (isAbortReason(e && e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (e) {
          if (isAbortReason(e && (e.error || e.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        try {
          var saved = localStorage.getItem('shift_tracker_theme');
          var theme = saved ? JSON.parse(saved) : null;
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // إذا تم فتح index.html من جذر GitHub Pages مباشرة دون تشغيل Vite، يتم التحويل تلقائياً إلى النسخة المدمجة الجاهزة داخل ./docs/
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && /\.github\.io$/i.test(window.location.hostname) && !/\/docs(\/|$)/.test(window.location.pathname)) {
            var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
            window.location.replace(base + 'docs/');
          }
        }, 600);
      });
    </script>
  </body>
